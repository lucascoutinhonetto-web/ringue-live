<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ringue da Live</title>
<style>
  :root { --verm:#e53935; --verde:#2e9d3a; --ouro:#ffd23f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Arial Black',Impact,system-ui,sans-serif; color:#fff; }
  body { background:radial-gradient(ellipse at 50% 20%, #2b3a8a 0%, #0d1233 60%, #05060f 100%); }
  body.transparente { background:transparent; }

  #palco { position:relative; width:100%; height:100%; max-width:720px; margin:0 auto; }

  /* holofotes */
  .luz { position:absolute; top:-10%; width:40%; height:70%; background:radial-gradient(ellipse at top, rgba(255,255,255,.18), transparent 70%); pointer-events:none; }
  .luz.e { left:5%; transform:rotate(12deg); } .luz.d { right:5%; transform:rotate(-12deg); }
  body.transparente .luz { display:none; }

  /* ringue */
  #ringue { position:absolute; left:0; right:0; bottom:8%; height:30%; }
  .corda { position:absolute; left:2%; right:2%; height:5px; border-radius:3px; box-shadow:0 2px 4px rgba(0,0,0,.5); }
  .corda:nth-child(1){ top:0;   background:#d32f2f; }
  .corda:nth-child(2){ top:22%; background:#fafafa; }
  .corda:nth-child(3){ top:44%; background:#1e56d6; }
  .poste { position:absolute; top:-6%; width:12px; height:60%; background:linear-gradient(#ccc,#666); border-radius:4px; }
  .poste.e{ left:1%; } .poste.d{ right:1%; }
  #lona { position:absolute; left:0; right:0; bottom:0; height:42%; background:linear-gradient(#2a3fa8,#1a2670); border-top:4px solid #fff3; }

  /* placar */
  #placar { position:absolute; top:3%; left:3%; right:3%; display:flex; gap:10px; align-items:center; z-index:5; }
  .lado { flex:1; }
  .nome { font-size:clamp(14px,4.5vw,26px); text-shadow:2px 2px 0 #000; display:flex; justify-content:space-between; }
  .lado.b .nome { flex-direction:row-reverse; }
  .vitorias { color:var(--ouro); }
  .barra { height:18px; background:#0008; border:2px solid #fff; border-radius:10px; overflow:hidden; margin-top:4px; }
  .vida { height:100%; width:100%; transition:width .25s; }
  .lado.a .vida { background:linear-gradient(90deg,#ff8a80,var(--verm)); }
  .lado.b .barra { transform:scaleX(-1); }
  .lado.b .vida { background:linear-gradient(90deg,#9be7a0,var(--verde)); }
  #vs { font-size:clamp(18px,6vw,34px); color:var(--ouro); text-shadow:2px 2px 0 #000; }

  /* lutadores */
  .lutador { position:absolute; bottom:10%; width:56%; height:60%; z-index:3; transition:transform .12s ease-out; }
  .lutador.a { left:-4%;  transform-origin:bottom left; }
  .lutador.b { right:-4%; transform-origin:bottom right; }
  .lutador img { width:100%; height:100%; object-fit:contain; object-position:bottom; filter:drop-shadow(0 8px 10px rgba(0,0,0,.55)); }
  .lutador.b.espelhar img { transform:scaleX(-1); }
  .lutador.a.espelhar img { transform:scaleX(-1); }

  /* boneco reserva (aparece se a imagem não carregar) */
  .reserva { display:none; width:100%; height:100%; }
  .sem-img img { display:none; } .sem-img .reserva { display:block; }

  .lutador.balanco { animation:balanco 1.6s ease-in-out infinite; }
  @keyframes balanco { 0%,100%{ translate:0 0; } 50%{ translate:0 -6px; } }

  .lutador.a.soca { transform:translateX(26%) rotate(4deg) scale(1.06); z-index:4; }
  .lutador.b.soca { transform:translateX(-26%) rotate(-4deg) scale(1.06); z-index:4; }
  .lutador.a.apanha { transform:translateX(-10%) rotate(-10deg); filter:brightness(2.2) saturate(.3); }
  .lutador.b.apanha { transform:translateX(10%) rotate(10deg); filter:brightness(2.2) saturate(.3); }
  .lutador.a.caido { transform:translateX(-8%) rotate(-80deg) translateY(20%); transition:transform .6s; }
  .lutador.b.caido { transform:translateX(8%) rotate(80deg) translateY(20%); transition:transform .6s; }

  /* efeitos */
  .pow { position:absolute; z-index:6; font-size:clamp(28px,10vw,64px); color:var(--ouro); -webkit-text-stroke:3px #000;
         pointer-events:none; animation:pow .7s ease-out forwards; }
  @keyframes pow { 0%{ transform:scale(.2) rotate(-15deg); opacity:1; } 40%{ transform:scale(1.2) rotate(8deg); } 100%{ transform:scale(1) translateY(-40px); opacity:0; } }
  .estrela { position:absolute; z-index:6; font-size:clamp(16px,5vw,30px); pointer-events:none; animation:estrela 1s ease-out forwards; }
  @keyframes estrela { to { transform:translate(var(--dx),var(--dy)) rotate(360deg); opacity:0; } }
  .tremer { animation:tremer .25s; }
  @keyframes tremer { 25%{ transform:translate(-6px,3px);} 50%{ transform:translate(5px,-4px);} 75%{ transform:translate(-3px,-2px);} }

  #ko { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:8;
        background:rgba(0,0,0,.45); text-align:center; }
  #ko.on { display:flex; animation:pow .5s ease-out reverse; animation:none; }
  #ko b { font-size:clamp(60px,22vw,140px); color:var(--ouro); -webkit-text-stroke:4px #000; }
  #ko span { font-size:clamp(18px,6vw,36px); text-shadow:2px 2px 0 #000; }

  /* quem mandou o presente */
  #avisos { position:absolute; top:16%; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:4px; z-index:7; pointer-events:none; }
  .aviso { background:#000a; border-radius:20px; padding:4px 12px; font-family:system-ui,sans-serif; font-weight:700; font-size:clamp(11px,3.4vw,16px);
           animation:aviso 2.5s ease-out forwards; border-left:5px solid; }
  .aviso.a { border-color:var(--verm); } .aviso.b { border-color:var(--verde); }
  @keyframes aviso { 0%{ opacity:0; transform:translateY(-8px);} 10%,80%{ opacity:1; transform:none;} 100%{ opacity:0; } }

  #status { position:absolute; bottom:1%; left:2%; font:600 11px system-ui,sans-serif; background:#0008; padding:3px 8px; border-radius:8px; z-index:9; }
  #status.ok::before { content:'● '; color:#4cff6a; } #status.off::before { content:'● '; color:#ff5252; }
  body.limpo #status { display:none; }

  #teste { position:absolute; bottom:1%; right:2%; display:flex; gap:6px; z-index:9; }
  #teste button { font:700 13px system-ui; padding:8px 12px; border:0; border-radius:8px; color:#fff; cursor:pointer; }
  #teste .a { background:var(--verm); } #teste .b { background:var(--verde); } #teste .r { background:#555; }
</style>
</head>
<body>
<div id="palco">
  <div class="luz e"></div><div class="luz d"></div>

  <div id="placar">
    <div class="lado a"><div class="nome"><span id="nomeA">VERMELHO</span><span class="vitorias" id="vitA">0</span></div><div class="barra"><div class="vida" id="vidaA"></div></div></div>
    <div id="vs">VS</div>
    <div class="lado b"><div class="nome"><span id="nomeB">VERDE</span><span class="vitorias" id="vitB">0</span></div><div class="barra"><div class="vida" id="vidaB"></div></div></div>
  </div>

  <div id="ringue">
    <div class="poste e"></div><div class="poste d"></div>
    <div class="corda"></div><div class="corda"></div><div class="corda"></div>
    <div id="lona"></div>
  </div>

  <div class="lutador a balanco" id="lutA">
    <img src="vermelho.png" alt="" onerror="this.parentNode.classList.add('sem-img')">
    <svg class="reserva" viewBox="0 0 100 140"><circle cx="45" cy="30" r="20" fill="#f1c27d" stroke="#000" stroke-width="3"/><rect x="28" y="50" width="34" height="45" rx="8" fill="#e53935" stroke="#000" stroke-width="3"/><circle cx="78" cy="62" r="13" fill="#e53935" stroke="#000" stroke-width="3"/><rect x="30" y="95" width="12" height="40" fill="#b71c1c" stroke="#000" stroke-width="3"/><rect x="48" y="95" width="12" height="40" fill="#b71c1c" stroke="#000" stroke-width="3"/></svg>
  </div>
  <div class="lutador b balanco" id="lutB">
    <img src="verde.png" alt="" onerror="this.parentNode.classList.add('sem-img')">
    <svg class="reserva" viewBox="0 0 100 140"><circle cx="55" cy="30" r="20" fill="#f1c27d" stroke="#000" stroke-width="3"/><rect x="38" y="50" width="34" height="45" rx="8" fill="#ffd23f" stroke="#000" stroke-width="3"/><circle cx="22" cy="62" r="13" fill="#2e9d3a" stroke="#000" stroke-width="3"/><rect x="40" y="95" width="12" height="40" fill="#2e9d3a" stroke="#000" stroke-width="3"/><rect x="58" y="95" width="12" height="40" fill="#2e9d3a" stroke="#000" stroke-width="3"/></svg>
  </div>

  <div id="avisos"></div>
  <div id="ko"><b>K.O.!</b><span id="koTexto"></span></div>
  <div id="status" class="off">conectando...</div>
  <div id="teste" hidden>
    <button class="a" onclick="soco('a',1,'teste')">Soco ⬅</button>
    <button class="b" onclick="soco('b',1,'teste')">Soco ➡</button>
    <button class="r" onclick="novoRound()">Reset</button>
  </div>
</div>

<script>
// ===== Configuração pelo link: ?a=NOME&b=NOME&dano=5&fundo=0&limpo&teste&espelharA&espelharB =====
const q = new URLSearchParams(location.search);
const NOME_A = q.get('a') || 'VERMELHO';
const NOME_B = q.get('b') || 'VERDE';
const DANO = Math.max(1, Number(q.get('dano')) || 5);
if (q.get('fundo') === '0') document.body.classList.add('transparente');
if (q.has('limpo')) document.body.classList.add('limpo');
if (q.has('teste')) document.getElementById('teste').hidden = false;
if (q.has('espelharA')) document.getElementById('lutA').classList.add('espelhar');
if (q.has('espelharB')) document.getElementById('lutB').classList.add('espelhar');

const $ = id => document.getElementById(id);
$('nomeA').textContent = NOME_A; $('nomeB').textContent = NOME_B;

let vida = { a:100, b:100 }, vit = { a:0, b:0 }, fila = [], ocupado = false, emKO = false;
try { vit = JSON.parse(localStorage.getItem('ringue-vit')) || vit; } catch {}
const atualiza = () => {
  $('vidaA').style.width = vida.a + '%'; $('vidaB').style.width = vida.b + '%';
  $('vitA').textContent = vit.a; $('vitB').textContent = vit.b;
};

function aviso(lado, texto) {
  const el = document.createElement('div');
  el.className = 'aviso ' + lado; el.textContent = texto;
  $('avisos').prepend(el); setTimeout(() => el.remove(), 2600);
  while ($('avisos').children.length > 4) $('avisos').lastChild.remove();
}

function soco(lado, qtd = 1, quem = '', presente = '') {
  if (quem && quem !== 'teste') aviso(lado, `${quem} → ${presente || 'presente'} x${qtd}`);
  for (let i = 0; i < qtd; i++) fila.push(lado);
  if (!ocupado) proximo();
}

function proximo() {
  if (emKO || !fila.length) { ocupado = false; return; }
  ocupado = true;
  const lado = fila.shift(), alvo = lado === 'a' ? 'b' : 'a';
  const atk = $('lut' + lado.toUpperCase()), def = $('lut' + alvo.toUpperCase());
  atk.classList.remove('balanco'); def.classList.remove('balanco');
  atk.classList.add('soca');

  setTimeout(() => {
    def.classList.add('apanha');
    efeitos(def);
    vida[alvo] = Math.max(0, vida[alvo] - DANO); atualiza();
  }, 110);

  setTimeout(() => {
    atk.classList.remove('soca'); def.classList.remove('apanha');
    atk.classList.add('balanco'); def.classList.add('balanco');
    if (vida[alvo] <= 0) return nocaute(lado, alvo);
    setTimeout(proximo, fila.length > 10 ? 40 : 120);
  }, 330);
}

function efeitos(def) {
  const r = def.getBoundingClientRect(), p = $('palco').getBoundingClientRect();
  const x = r.left - p.left + r.width * (def.id === 'lutB' ? .35 : .55), y = r.top - p.top + r.height * .15;
  const pow = document.createElement('div');
  pow.className = 'pow'; pow.textContent = ['POW!','BAM!','TUM!','PÁ!','KABUM!'][Math.random()*5|0];
  pow.style.left = (x - 50) + 'px'; pow.style.top = (y - 20) + 'px';
  $('palco').appendChild(pow); setTimeout(() => pow.remove(), 750);
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('div');
    s.className = 'estrela'; s.textContent = i % 2 ? '⭐' : '💫';
    s.style.left = x + 'px'; s.style.top = (y + 20) + 'px';
    s.style.setProperty('--dx', (Math.random()*120-60) + 'px'); s.style.setProperty('--dy', (-40 - Math.random()*60) + 'px');
    $('palco').appendChild(s); setTimeout(() => s.remove(), 1000);
  }
  $('palco').classList.remove('tremer'); void $('palco').offsetWidth; $('palco').classList.add('tremer');
}

function nocaute(venc, perd) {
  emKO = true; fila = [];
  $('lut' + perd.toUpperCase()).classList.remove('balanco');
  $('lut' + perd.toUpperCase()).classList.add('caido');
  vit[venc]++; try { localStorage.setItem('ringue-vit', JSON.stringify(vit)); } catch {}
  atualiza();
  $('koTexto').textContent = (venc === 'a' ? NOME_A : NOME_B) + ' VENCEU!';
  $('ko').classList.add('on');
  setTimeout(novoRound, 5000);
}

function novoRound() {
  emKO = false; fila = []; ocupado = false; vida = { a:100, b:100 };
  $('ko').classList.remove('on');
  ['lutA','lutB'].forEach(id => { $(id).className = $(id).className.replace(/\b(caido|soca|apanha)\b/g,'').trim(); $(id).classList.add('balanco'); });
  atualiza();
}

// ===== Conexão com o servidor (reconecta sozinha, sem limite) =====
function setStatus(t, ok) { $('status').textContent = t; $('status').className = ok ? 'ok' : 'off'; }
let ws, espera = 1000;
function conectar() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => { espera = 1000; setStatus('servidor ok', true); };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.tipo === 'soco') soco(m.lado, m.qtd || 1, m.quem, m.presente);
    if (m.tipo === 'status') setStatus(m.texto, m.texto.startsWith('Conectado'));
  };
  ws.onclose = () => { setStatus('reconectando ao servidor...', false); setTimeout(conectar, espera); espera = Math.min(espera * 2, 15000); };
  ws.onerror = () => ws.close();
}
// volta a conectar quando o celular "acorda" a tela
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!ws || ws.readyState > 1)) conectar(); });

atualiza();
if (location.protocol.startsWith('http')) conectar();
else { $('teste').hidden = false; setStatus('modo teste (arquivo aberto direto)', false); }
</script>
</body>
</html>
